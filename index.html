<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>量化策略图鉴</title>
<meta name="description" content="20 类常见量化策略：形状与物理对应、交易周期、秒级视角与统计检验">
<meta name="theme-color" content="#f2ede5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1e1b17" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="策略图鉴">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="fonts/lxgwwenkaigbscreen/result.min.css">
<link rel="stylesheet" href="fonts/lxgwwenkaimonogbscreen/result.min.css">
<style>
/* 布局：左侧固定索引（按策略类别分组）＋ 右侧一次只看一个策略；窄屏时索引变成顶部下拉。
   配色沿用「慢慢联系」：燕麦（默认）/ 暮紫，各有浅深两套；不用纯白纯黑，无动画，实线边框。 */
:root {
  --bg: #f2ede5;
  --surface: #faf7f2;
  --surface-2: #ece5da;
  --text: #3a332b;
  --muted: #675e52;
  --border: #e0d6c7;
  --accent: #7e6447;
  --accent-text: #faf7f2;
  --accent-soft: #ebe1d3;
  --accent-strong: #5e4a34;
  --other: #5f7a94;          /* 第二色：卖方 / 对比序列（灰蓝） */
  --other-soft: #e2e6e9;
  --warn: #9a7a35;
  --illo-ink: #8c7b66;
  --illo-fill: #e8dcc9;
  --font-body: 'LXGW WenKai GB Screen', 'LXGW WenKai Screen', 'LXGW WenKai', 'LXGW WenKai TC', 'Kaiti SC', 'STKaiti', -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif;
  --font-data: 'LXGW WenKai Mono GB Screen', 'LXGW WenKai Mono TC', 'LXGW WenKai Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  --fs-s: 0.8125rem;
  --fs-m: 0.9375rem;
  --fs-b: 1rem;
  --fs-l: 1.1875rem;
  --fs-xl: 1.5rem;
  --fs-xxl: 1.875rem;
  --r: 8px;
  color-scheme: light;
}
:root[data-palette="dusk"] {
  --bg: #eeecf1; --surface: #f8f7fa; --surface-2: #e6e3ec; --text: #322f3a; --muted: #625e75;
  --border: #dcd8e3; --accent: #645e80; --accent-text: #f8f7fa; --accent-soft: #e3e0ec; --accent-strong: #4a4563;
  --other: #5c7f8f; --other-soft: #e0e7ea; --warn: #8f7738; --illo-ink: #7d7896; --illo-fill: #dfdbea;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1e1b17; --surface: #27231e; --surface-2: #312c26; --text: #ded6ca; --muted: #b3a898;
    --border: #3d372f; --accent: #a99174; --accent-text: #1f1913; --accent-soft: #3a3128; --accent-strong: #e3cfb2;
    --other: #8fa7bd; --other-soft: #2c333a; --warn: #c4a765; --illo-ink: #a8977f; --illo-fill: #3a3128;
    color-scheme: dark;
  }
  :root:not([data-theme="light"])[data-palette="dusk"] {
    --bg: #1b1a20; --surface: #24232b; --surface-2: #2e2c36; --text: #dad7e1; --muted: #ada8bc;
    --border: #3a3845; --accent: #9890b8; --accent-text: #1c1a24; --accent-soft: #34314a; --accent-strong: #d3cdea;
    --other: #8fb0bd; --other-soft: #2a3238; --warn: #c2a768; --illo-ink: #8f89aa; --illo-fill: #34314a;
  }
}
:root[data-theme="dark"] {
  --bg: #1e1b17; --surface: #27231e; --surface-2: #312c26; --text: #ded6ca; --muted: #b3a898;
  --border: #3d372f; --accent: #a99174; --accent-text: #1f1913; --accent-soft: #3a3128; --accent-strong: #e3cfb2;
  --other: #8fa7bd; --other-soft: #2c333a; --warn: #c4a765; --illo-ink: #a8977f; --illo-fill: #3a3128;
  color-scheme: dark;
}
:root[data-theme="dark"][data-palette="dusk"] {
  --bg: #1b1a20; --surface: #24232b; --surface-2: #2e2c36; --text: #dad7e1; --muted: #ada8bc;
  --border: #3a3845; --accent: #9890b8; --accent-text: #1c1a24; --accent-soft: #34314a; --accent-strong: #d3cdea;
  --other: #8fb0bd; --other-soft: #2a3238; --warn: #c2a768; --illo-ink: #8f89aa; --illo-fill: #34314a;
}
:root[data-font="large"] { font-size: 18.5px; }

:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); -webkit-text-size-adjust: 100%; }
[hidden] { display: none !important; }
img { max-width: 100%; }
*, *::before, *::after { box-sizing: border-box; animation: none !important; scroll-behavior: auto !important; }
body {
  margin: 0; -webkit-tap-highlight-color: transparent; background: var(--bg); color: var(--text);
  font-family: var(--font-body); font-size: var(--fs-b); line-height: 1.7; letter-spacing: 0.01em;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
a { color: var(--accent-strong); text-underline-offset: 3px; }
:focus-visible { outline: 2px solid var(--other); outline-offset: 2px; border-radius: 4px; }
h1, h2, h3 { text-wrap: balance; line-height: 1.35; margin: 0; font-weight: 700; }
p { margin: 0; }
.num, .mono { font-family: var(--font-data); font-variant-numeric: tabular-nums; }

.shell { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 48px; max-width: 1180px; margin: 0 auto; }

.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 24px; padding-block: 18px 16px; border-bottom: 1px solid var(--border); }
.brand { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.brand a { color: var(--text); text-decoration: none; font-size: var(--fs-l); font-weight: 700; }
.brand .sub { color: var(--muted); font-size: var(--fs-s); }
.prefs { display: flex; gap: 16px; flex-wrap: wrap; align-items: center; font-size: var(--fs-s); color: var(--muted); }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; background: var(--surface); }
.seg button { font: inherit; font-size: var(--fs-s); color: var(--text); background: transparent; border: 0; padding: 4px 12px; min-height: 30px; cursor: pointer; }
@media (pointer: coarse) { .seg button { min-height: 36px; padding: 4px 14px; } .btn { min-height: 40px; } }
.seg button + button { border-left: 1px solid var(--border); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-text); }
.pref { display: flex; align-items: center; gap: 8px; }

.layout { display: grid; grid-template-columns: 232px minmax(0, 1fr); gap: 40px; padding-top: 24px; }
.index { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); align-self: start; max-height: calc(100vh - 32px); overflow-y: auto; display: flex; flex-direction: column; gap: 18px; padding-right: 4px; }
.index h3 { font-size: var(--fs-s); color: var(--muted); font-weight: 400; letter-spacing: 0.08em; margin-bottom: 4px; }
.index ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.index a { display: block; padding: 3px 10px; border-radius: 6px; color: var(--text); text-decoration: none; font-size: var(--fs-m); }
.index a:hover { background: var(--surface-2); }
.index a[aria-current="page"] { background: var(--accent-soft); color: var(--accent-strong); font-weight: 700; }
.picker { display: none; }

main { min-width: 0; max-width: 820px; display: flex; flex-direction: column; gap: 20px; }
#content { display: flex; flex-direction: column; gap: 36px; min-width: 0; }
.crumb { font-size: var(--fs-s); color: var(--muted); }
.head { display: flex; flex-direction: column; gap: 10px; }
.head h1 { font-size: var(--fs-xxl); }
.head .en { font-family: var(--font-data); color: var(--muted); font-size: var(--fs-s); letter-spacing: 0.04em; }
.lead { font-size: var(--fs-l); line-height: 1.65; max-width: 38em; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { font-size: var(--fs-s); border: 1px solid var(--border); background: var(--surface); border-radius: 6px; padding: 1px 10px; color: var(--muted); }
.chip b { color: var(--text); font-weight: 400; }

section { display: flex; flex-direction: column; gap: 14px; }
section > h2 { font-size: var(--fs-l); display: flex; align-items: baseline; gap: 10px; }
section > h2 .tag { font-size: var(--fs-s); font-weight: 400; color: var(--muted); }
.prose { display: flex; flex-direction: column; gap: 12px; max-width: 40em; }
.note { font-size: var(--fs-s); color: var(--muted); max-width: 46em; }

.diagram { overflow-x: auto; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 12px; }
.diagram svg { display: block; }
.lane text { font-family: var(--font-body); font-size: 13px; fill: var(--text); }
.lane .halo { paint-order: stroke; stroke: var(--surface); stroke-width: 5px; stroke-linejoin: round; }
.lane .ln-h { fill: var(--surface-2); stroke: var(--border); }
.lane .ln-l { stroke: var(--border); stroke-width: 1.5; }
.lane .ln-row { stroke: var(--surface-2); stroke-width: 1; }
.lane .ln-a { stroke: var(--accent); stroke-width: 1.6; fill: none; }
.lane .ah { fill: var(--accent); }
.lane .ln-s { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.4; }
.lane .ln-nc { fill: var(--bg); stroke: var(--border); }
.lane .ln-n { font-family: var(--font-data); font-size: 11px; fill: var(--muted); }
ol.steps { margin: 0; padding-left: 1.6em; display: flex; flex-direction: column; gap: 4px; max-width: 44em; font-size: var(--fs-m); }
ol.steps li::marker { font-family: var(--font-data); color: var(--muted); }
ol.steps .sn { color: var(--muted); }

.panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.panel .bar { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
.panel .status { font-size: var(--fs-s); color: var(--muted); }
.btn { font: inherit; font-size: var(--fs-m); padding: 5px 14px; border-radius: 6px; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-text); cursor: pointer; }
.btn.quiet { background: transparent; color: var(--accent-strong); border-color: var(--border); }
.btn:disabled { opacity: 0.45; cursor: default; }
.msg { background: var(--surface-2); border-radius: 6px; padding: 10px 12px; font-size: var(--fs-m); min-height: 4.6em; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.tbl-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: var(--fs-s); }
th, td { padding: 5px 8px; border-bottom: 1px solid var(--border); text-align: left; vertical-align: top; }
th { color: var(--muted); font-weight: 400; white-space: nowrap; }
td.r, th.r { text-align: right; }
td.num, td.r { font-family: var(--font-data); font-variant-numeric: tabular-nums; }
tr.hl td { background: var(--accent-soft); }
tr.dim td { color: var(--muted); }
.buy { color: var(--accent-strong); }
.sell { color: var(--other); }
.okv { color: var(--accent-strong); }
.warnv { color: var(--warn); }
.cell-bar { display: flex; align-items: center; gap: 8px; }
.cell-bar span.b { display: inline-block; height: 8px; background: var(--accent); border-radius: 2px; }
.ord { display: inline-block; font-family: var(--font-data); font-size: 12px; border: 1px solid var(--border); border-radius: 4px; padding: 0 5px; margin: 1px 2px; background: var(--bg); white-space: nowrap; }
.qlist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; font-size: var(--fs-s); }
.qlist li { display: flex; gap: 10px; }
.qlist .st { width: 4.5em; flex: none; color: var(--muted); }
.qlist li.cur { color: var(--accent-strong); }
.qlist li.cur .st { color: var(--accent-strong); }
.ctrl { display: grid; grid-template-columns: 7.5em minmax(0, 1fr) 4.5em; align-items: center; gap: 4px 10px; font-size: var(--fs-s); }
.ctrl input[type="range"] { width: 100%; accent-color: var(--accent); }
.ctrl output { font-family: var(--font-data); text-align: right; }
input[type="number"] { font: inherit; font-family: var(--font-data); width: 7em; padding: 3px 6px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--text); }
.formula { font-family: var(--font-data); font-size: var(--fs-s); background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; line-height: 1.8; overflow-x: auto; white-space: nowrap; }
svg.chart { width: 100%; height: auto; display: block; }
svg.chart text { font-family: var(--font-body); font-size: 12px; fill: var(--muted); }
svg.chart .t-strong { fill: var(--text); }
svg.chart .grid { stroke: var(--surface-2); stroke-width: 1; }
svg.chart .axis { stroke: var(--border); stroke-width: 1; }
.ems { font-family: var(--font-data); font-size: 12.5px; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
.ems .row { display: grid; grid-template-columns: repeat(7, minmax(max-content, 1fr)); gap: 0 14px; padding: 6px 10px; overflow-x: auto; }
.ems .row.h { background: var(--surface-2); color: var(--muted); }
.prog { height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; }
.prog span { display: block; height: 100%; background: var(--accent); }

dl.two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin: 0; }
dl.two > div { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; }
dl.two dt { font-size: var(--fs-s); color: var(--muted); }
dl.two dd { margin: 0; font-size: var(--fs-m); }
ul.rules { margin: 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 8px; max-width: 44em; font-size: var(--fs-m); }
ul.rules .d { font-family: var(--font-data); font-size: var(--fs-s); color: var(--muted); margin-right: 6px; }
dl.terms { display: grid; grid-template-columns: repeat(auto-fill, minmax(15em, 1fr)); gap: 10px 24px; margin: 0; }
dl.terms div { border-top: 1px solid var(--border); padding-top: 6px; }
dl.terms dt { font-weight: 700; font-size: var(--fs-m); }
dl.terms dd { margin: 0; font-size: var(--fs-s); color: var(--muted); }
.links { display: flex; flex-wrap: wrap; gap: 8px; }
.links a { font-size: var(--fs-m); border: 1px solid var(--border); background: var(--surface); padding: 2px 12px; border-radius: 6px; text-decoration: none; }
.links a:hover { background: var(--surface-2); }
.src { font-size: var(--fs-s); color: var(--muted); display: flex; flex-direction: column; gap: 2px; }
.pager { display: flex; justify-content: space-between; gap: 12px; border-top: 1px solid var(--border); padding-top: 16px; font-size: var(--fs-m); }
.pager a { text-decoration: none; }

/* 量化策略图鉴的补充样式 */
.ctrl { grid-template-columns: minmax(8em, 12em) minmax(0, 1fr) 4.5em; }
.ctrl input:disabled { opacity: 0.4; }
.panel .bar .pref { font-size: var(--fs-s); color: var(--muted); }
h3.sub { font-size: var(--fs-m); margin-top: 6px; }
.shape { border-left: 3px solid var(--accent); padding: 2px 0 2px 14px; max-width: 42em; }
.formula { white-space: normal; }
section > h2 .tag { font-weight: 400; }
.refs { font-size: var(--fs-s); color: var(--muted); display: flex; flex-direction: column; gap: 2px; }
.refs span:first-child { color: var(--text); }
svg.chart .halo { paint-order: stroke; stroke: var(--surface); stroke-width: 4px; stroke-linejoin: round; }

/* 总览 */
.smap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--r); background: var(--bg); }
.smap svg { display: block; }
.smap text { font-family: var(--font-body); font-size: 13px; fill: var(--text); }
.smap .band-l { font-size: 12px; fill: var(--muted); }
.smap .t-strong { font-weight: 700; }
.smap a:hover text, .smap a:focus-visible text { fill: var(--accent-strong); text-decoration: underline; }
.groups { display: flex; flex-direction: column; gap: 22px; }
.grp { display: flex; flex-direction: column; gap: 8px; }
.grp h3 { font-size: var(--fs-m); display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
.grp h3 .tag { font-size: var(--fs-s); font-weight: 400; color: var(--muted); }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(14em, 1fr)); gap: 10px; }
.card { display: flex; flex-direction: column; gap: 2px; padding: 8px 12px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); color: var(--text); text-decoration: none; }
.card:hover { border-color: var(--accent); }
.card small { font-size: 12.5px; color: var(--muted); }
.axes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.axes > div { border-top: 1px solid var(--border); padding-top: 8px; display: flex; flex-direction: column; gap: 4px; }
.axes h3 { font-size: var(--fs-m); }
.axes p { font-size: var(--fs-s); color: var(--muted); }

/* 认图 */
.lineup { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.lineup button { font: inherit; font-size: 12.5px; display: flex; flex-direction: column; gap: 2px; align-items: stretch; padding: 4px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--muted); cursor: pointer; }
.lineup button:disabled { cursor: default; }
.lineup button.pick { border-color: var(--other); border-width: 2px; padding: 3px; }
.lineup button.real { border-color: var(--accent); border-width: 2px; padding: 3px; background: var(--accent-soft); color: var(--accent-strong); }
.lineup .cap { min-height: 1.5em; }

@media (max-width: 860px) {
  .layout { grid-template-columns: minmax(0, 1fr); gap: 20px; padding-top: 16px; }
  .index { display: none; }
  .picker { display: flex; flex-direction: column; gap: 4px; font-size: var(--fs-s); color: var(--muted); }
  .picker select { font: inherit; font-size: var(--fs-b); color: var(--text); background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; }
}
@media (max-width: 560px) {
  .grid2, dl.two, .axes { grid-template-columns: minmax(0, 1fr); }
  .head h1 { font-size: var(--fs-xl); }
  .ctrl { grid-template-columns: minmax(6.5em, 8.5em) minmax(0, 1fr) 4em; }
  .lineup { gap: 6px; }
}
</style>
</head>
<body>

<div class="shell">
  <header class="top">
    <div class="brand"><a href="#overview">量化策略图鉴</a><span class="sub">20 类策略 · 交互图中的数据均为模拟</span></div>
    <div class="prefs">
      <div class="pref"><span id="lbl-pal">配色</span><div class="seg" role="group" aria-labelledby="lbl-pal"><button type="button" id="pal-oat" data-pal="oat">燕麦</button><button type="button" id="pal-dusk" data-pal="dusk">暮紫</button></div></div>
      <div class="pref"><span id="lbl-theme">深浅</span><div class="seg" role="group" aria-labelledby="lbl-theme"><button type="button" id="theme-system" data-theme-pick="system">跟随系统</button><button type="button" id="theme-light" data-theme-pick="light">浅</button><button type="button" id="theme-dark" data-theme-pick="dark">深</button></div></div>
      <div class="pref"><span id="lbl-font">字号</span><div class="seg" role="group" aria-labelledby="lbl-font"><button type="button" id="font-normal" data-font="normal">标准</button><button type="button" id="font-large" data-font="large">大</button></div></div>
    </div>
  </header>
  <div class="layout">
    <nav class="index" id="index" aria-label="策略目录"></nav>
    <main id="view">
      <div class="picker"><label for="picker">选择策略</label><select id="picker"></select></div>
      <div id="content"></div>
    </main>
  </div>
</div>

<script>
'use strict';
const GROUPS = [
  ['T', '趋势与动量', '价格朝一个方向持续，或强的继续强'],
  ['R', '均值回归', '偏离之后被拉回'],
  ['A', '套利与价差', '两个价格之间有成本或规则约束'],
  ['M', '微观结构与高频', '盘口、订单流、延迟、被迫交易'],
  ['V', '波动率', '交易波动的大小，而不是方向'],
  ['S', '研究与执行', '每种策略都会用到的工具']
];

const E = [
/* ---------- 趋势与动量 ---------- */

{ id: 'obi', g: 'M', name: '盘口不平衡与微观价格', short: '盘口不平衡', en: 'Order Book Imbalance & Micro-Price',
  hold: '百毫秒到数秒', src: '对下一次价格变动方向的预测', mk: '加密 · 商品期货',
  phys: '盘口的重心', pos: [0.2, 2, 0.68, 'r'],
  one: '比较买一和卖一的挂单量。挂单少的一边更容易被吃穿，价格更可能朝那边移动一跳。',
  shape: '把盘口看成一根杆：左端是买一价，右端是卖一价，两端挂的量是两端的重量。重心所在的位置就是微观价格。买单远多于卖单时，重心靠近卖一价，下一次价格变动更可能向上。对应的统计形状是一条 S 形曲线：横轴是不平衡度，纵轴是下一次变动向上的概率。',
  does: [
    '不平衡度 I = 买一量 ÷（买一量 + 卖一量），取值在 0 到 1 之间。',
    '微观价格 = 卖一价 × I + 买一价 × (1 − I)。Stoikov（2018）给出了更严格的版本，用不平衡度和价差状态的转移概率迭代估计。',
    '多档版本：对前几档加权求和，越远的档权重越小；或者把各档挂单量作为特征输入模型。',
    '用途：作为做市的公允价格；作为吃单的触发条件（不平衡度很极端且价差为一跳时市价成交）；作为执行算法判断是否继续等待的依据。'
  ],
  flow: { lanes: ['行情', '特征', '模型', '执行', '交易所'], steps: [

    [1, 2, '下一次变动向上的概率 0.67'],
    [2, 3, '概率超过阈值，预期收益大于成本'],
    [3, 4, '在卖一买入'],
    [4, 3, '成交'],
    [2, 3, '不平衡度回到中性，挂单卖出'],
    [3, 4, '挂单']
  ]},
  tick: '币安的 20 档 100 毫秒快照可以直接计算各档不平衡度。国内期货 CTP 普通行情每 500 毫秒一次快照，档数取决于交易所和行情级别，两次快照之间可能已经发生多次变化，信号需要按这个采样间隔单独检验。',
  stats: ['按不平衡度分箱，统计下一次中间价变动的方向频率，看是否呈 S 形。', '信号衰减：分别预测 100 毫秒、1 秒、10 秒后的变化，准确率如何下降。', '扣除价差和手续费后是否仍有正期望。', '价差为一跳和多跳时分别检验。'],
  params: [['档数与权重', '只用一档，还是前几档加权。'], ['触发阈值', '不平衡度或预测概率超过多少才下单。'], ['持有时长', '开仓后多久平仓，或等待几次价格变动。']],
  money: '赚的是对下一跳方向的预测。对手方是没有观察盘口的成交者，以及没有及时撤单的挂单者。',
  fail: '挂单可以瞬间撤销，不平衡度可能被虚假挂单操纵；一跳的收益常小于吃单费；信号被许多参与者使用后衰减。',
  terms: [['不平衡度', '买卖挂单量的相对比例。'], ['微观价格', '按挂单量加权的买卖价，比中间价更接近下一次成交价格。'], ['价差状态', '买一和卖一之间相差几跳。']],
  related: ['ofi', 'mm', 'leadlag'], ma: [['hft', '高频交易'], ['exchange', '交易所']],
  refs: ['Stoikov (2018). The Micro-Price: A High-Frequency Estimator of Future Prices. Quantitative Finance.', 'Cartea, Jaimungal, Penalva (2015). Algorithmic and High-Frequency Trading. Cambridge University Press.'],

{ id: 'ofi', g: 'M', name: '订单流不平衡', short: '订单流不平衡', en: 'Order Flow Imbalance (OFI)',

  phys: '推力与质量', pos: [1.0, 2, 0.3, 'r'],
  one: '统计一段时间内买方挂单增加、卖方挂单撤销和主动买入的总量，减去卖方的对应量。这个净流量与同期价格变动近似成正比。',
  shape: '这是一个力与质量的关系。净订单流（OFI）是推力，盘口深度是质量，价格变动是位移。同样的推力，盘口薄时价格移动大，盘口厚时移动小，散点图上是一条斜率约为“1 ÷ 深度”的直线。需要注意：这条直线描述的是同一时段内的关系。用这一段的 OFI 去预测下一段的价格，直线会变得很平。',
  does: [
    '逐事件 OFI（Cont、Kukanov、Stoikov 2014）：每次盘口更新，买一价上升或不变时加上新的买一量，买一价下降或不变时减去旧的买一量；卖一侧方向相反。把一个时间窗内的事件累加。',
    '回归：Δ中间价 = β × OFI + 噪声，β 与平均深度成反比。论文在美股上的同期 R² 平均约 65%，明显高于只用成交量的模型。',
    '预测用法：利用订单流的持续性（大单常拆成多笔）、多档 OFI、不同时间窗 OFI 的组合，预测下一段收益。预测力比同期解释力小得多。',
    '主动成交不平衡：只用逐笔成交的主动买量减主动卖量，数据要求更低。'
  ],
  flow: { lanes: ['逐笔与盘口', 'OFI 累加', '模型', '执行', '交易所'], steps: [
    [0, 1, '买一价不变，挂单量从 30 增到 42'],
    [1, 1, '事件贡献 e = +12'],
    [0, 1, '主动卖出 5 手，买一量降到 37'],
    [1, 1, '事件贡献 e = −5'],
    [1, 2, '10 秒窗口 OFI = +85，平均深度 40'],
    [2, 2, '预测下一窗口上涨 0.2 跳，低于成本'],
    [2, 3, '不交易'],
    [0, 1, '继续累加下一次更新']
  ]},
  tick: '币安的归集成交带有主动方向标记，可以直接算主动成交不平衡；100 毫秒盘口快照可以算近似的 OFI，快照之间的多次变化被合并成一次。国内期货可以用相邻快照之间成交量和价格的变化推断主动方向，但精度较低。',
  stats: ['同期回归的斜率与 R²；按深度分组，看斜率是否与深度成反比。', '预测回归（下一窗口）的斜率与 R²。', 'OFI 的自相关。', '不同窗口长度下的结果。'],
  params: [['窗口长度', '累加多长时间内的事件，常用 1–60 秒。'], ['使用档数', '只用最优一档，还是前几档分别计算。'], ['深度归一化', 'OFI 除以平均深度，使不同时段可以比较。']],
  money: '预测用法赚的是订单流延续带来的价格移动。对手方是被动挂单、没有及时撤单的一方。',
  fail: '同期关系很强、预测关系很弱，把同期关系误当成预测能力是常见错误。冰山单和频繁撤单让观察到的流量失真。',
  terms: [['OFI', '订单流不平衡，买方挂单与成交的净增量减去卖方的净增量。'], ['深度', '某一档或前几档的挂单量。'], ['同期与预测', '同一时段内的关系，以及用当前预测下一时段。'], ['主动方向', '成交由买方还是卖方主动发起。']],
  related: ['obi', 'mm', 'cascade'], ma: [['hft', '高频交易']],
  refs: ['Cont, Kukanov, Stoikov (2014). The Price Impact of Order Book Events. Journal of Financial Econometrics.', 'Kolm, Turiel, Westray (2023). Deep Order Flow Imbalance: Extracting Alpha at Multiple Horizons from the Limit Order Book. Mathematical Finance.'],
  widgets: [['策略示意：推力、质量与位移', 'ofi']] },

  phys: '沙堆与放大', pos: [2.6, 2, 0.68, 'r'],

    '其他事件：国内期货的涨跌停与扩板规则、交割月限仓、宏观数据公布、交易所规则变更、资金费率结算时点。'

/* ---------- 泳道图（一个交易周期） ---------- */
function laneSvg(f) {
  const n = f.lanes.length, LW = 158, PX = 40, HH = 48, SH = 46;
  const W = PX + n * LW + 8, H = HH + 22 + f.steps.length * SH;
  const cx = i => PX + LW * i + LW / 2;
  let s = `<svg class="lane" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="交易步骤图：${f.lanes.join('、')}">`;
  s += '<defs><marker id="ah-lane" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,1 L9,5 L0,9 z"/></marker></defs>';
  f.steps.forEach((st, i) => { const y = HH + 26 + i * SH; s += `<line class="ln-row" x1="30" x2="${W - 4}" y1="${y + SH / 2}" y2="${y + SH / 2}"/>`; });
  f.lanes.forEach((l, i) => {
    s += `<line class="ln-l" x1="${cx(i)}" x2="${cx(i)}" y1="40" y2="${H - 6}"/>`;
    s += `<rect class="ln-h" x="${cx(i) - 70}" y="6" width="140" height="34" rx="6"/><text x="${cx(i)}" y="28" text-anchor="middle">${l}</text>`;
  });
  f.steps.forEach((st, i) => {
    const [a, b, label] = st; const y = HH + 26 + i * SH;
    s += `<circle class="ln-nc" cx="16" cy="${y}" r="10"/><text class="ln-n" x="16" y="${y + 4}" text-anchor="middle">${i + 1}</text>`;
    if (a === b) {
      s += `<rect class="ln-s" x="${cx(a) - 6}" y="${y - 6}" width="12" height="12" rx="2"/>`;
      const last = a === n - 1 && n > 1;
      s += `<text class="halo" x="${last ? cx(a) - 14 : cx(a) + 14}" y="${y + 4.5}" text-anchor="${last ? 'end' : 'start'}">${label}</text>`;
    } else {
      const dir = b > a ? 1 : -1;
      s += `<line class="ln-a" x1="${cx(a) + dir * 6}" x2="${cx(b) - dir * 8}" y1="${y}" y2="${y}" marker-end="url(#ah-lane)"/>`;
      s += `<circle cx="${cx(a)}" cy="${y}" r="3" style="fill:var(--accent)"/>`;
      s += `<text class="halo" x="${(cx(a) + cx(b)) / 2}" y="${y - 8}" text-anchor="middle">${label}</text>`;
    }
  });
  return s + '</svg>';
}

  [[-1, '0.1 秒'], [0, '1 秒'], [1.78, '1 分钟'], [3.56, '1 小时'], [4.94, '1 天'], [5.78, '1 周'], [6.41, '1 月']].forEach(([v, t]) => {

/* ================= 绘图工具 ================= */
const col = c => `var(--${c})`;
/* 图表按内容区实际宽度绘制，手机上文字保持原始大小 */
const CW = () => Math.max(320, Math.min(640, ((document.querySelector('#content') || {}).clientWidth || 672) - 34));
const rngOf = seed => { let a = seed >>> 0; return () => { a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; };
const gaussOf = rnd => () => { let u = 0, v = 0; while (!u) u = rnd(); while (!v) v = rnd(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
const mean = a => a.reduce((s, v) => s + v, 0) / a.length;
const sd = a => { const m = mean(a); return Math.sqrt(a.reduce((s, v) => s + (v - m) ** 2, 0) / Math.max(1, a.length - 1)); };
const skew = a => { const m = mean(a), s = sd(a) || 1; return a.reduce((t, v) => t + ((v - m) / s) ** 3, 0) / a.length; };
const maxDD = eq => { let pk = -Infinity, dd = 0; eq.forEach(v => { pk = Math.max(pk, v); dd = Math.max(dd, pk - v); }); return dd; };
const sma = (a, n) => { const out = Array(a.length).fill(null); let s = 0; a.forEach((v, i) => { s += v; if (i >= n) s -= a[i - n]; if (i >= n - 1) out[i] = s / n; }); return out; };
function runs(pos, pc = 'accent-soft', nc = 'other-soft') { const out = []; const n = pos.length; let i = 0; while (i < n) { let j = i; while (j + 1 < n && pos[j + 1] === pos[i]) j++; if (pos[i]) out.push([i, Math.min(j + 1, n - 1), pos[i] > 0 ? pc : nc]); i = j + 1; } return out; }
function decOf(st) { const s = String(+st.toPrecision(6)); return s.includes('.') ? s.split('.')[1].length : 0; }
function ticks(lo, hi, n = 4) {
  const raw = (hi - lo) / n, mag = 10 ** Math.floor(Math.log10(raw));
  const st = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => s >= raw * 0.999);
  const out = []; for (let v = Math.ceil(lo / st - 1e-9) * st; v <= hi + 1e-9; v += st) out.push(+v.toFixed(10));
  return { out, d: decOf(st) };
}
function spreadLabels(labs, gap) { labs.sort((a, b) => a.y - b.y); for (let i = 1; i < labs.length; i++) if (labs[i].y - labs[i - 1].y < gap) labs[i].y = labs[i - 1].y + gap; return labs; }

/* 时间序列：多个面板共用横轴 */
function plot(o) {
  const Wd = o.w || CW(), L = o.l ?? 52, R = o.r ?? 84, n = o.n;
  const x = i => L + i / Math.max(1, n - 1) * (Wd - L - R);
  let y0 = 6, s = '';
  for (const p of o.panels) {
    if (p.title) { y0 += 18; s += `<text x="${L}" y="${y0 - 6}" class="t-strong">${p.title}</text>`; }
    const vals = [];
    (p.series || []).forEach(se => se.d.forEach(v => { if (v != null && isFinite(v)) vals.push(v); }));
    (p.hl || []).forEach(h => vals.push(h.v));
    if (p.bars) p.bars.d.forEach(v => vals.push(v, 0));
    (p.dots || []).forEach(d => vals.push(d.v));
    let lo = p.lo ?? Math.min(...vals), hi = p.hi ?? Math.max(...vals);
    if (!(hi > lo)) { lo -= 1; hi += 1; }
    const pad = (hi - lo) * 0.06; if (p.lo == null) lo -= pad; if (p.hi == null) hi += pad;
    const h = p.h || 170, y = v => y0 + (hi - Math.max(lo, Math.min(hi, v))) / (hi - lo) * h;
    (p.shade || []).forEach(([a, b, c]) => { s += `<rect x="${x(a).toFixed(1)}" y="${y0}" width="${Math.max(0.6, x(b) - x(a)).toFixed(1)}" height="${h}" style="fill:${col(c)}"/>`; });
    const tk = ticks(lo, hi, p.nt || 4);
    tk.out.forEach(v => { s += `<line class="grid" x1="${L}" x2="${Wd - R}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}"/><text x="${L - 6}" y="${(y(v) + 4).toFixed(1)}" text-anchor="end" class="num">${p.fmt ? p.fmt(v) : fmt(v, tk.d)}</text>`; });
    const labs = [];
    (p.hl || []).forEach(hh => { s += `<line x1="${L}" x2="${Wd - R}" y1="${y(hh.v).toFixed(1)}" y2="${y(hh.v).toFixed(1)}" style="stroke:${col(hh.c || 'muted')};stroke-width:${hh.w || 1}${hh.dash ? ';stroke-dasharray:5 4' : ''}"/>`; if (hh.label) labs.push({ y: y(hh.v) + 4, t: hh.label, c: hh.c || 'muted' }); });
    if (p.bars) {
      const b = p.bars, bw = (Wd - L - R) / n;
      if (b.merge) { let i = 0; while (i < n) { let j = i; while (j + 1 < n && b.d[j + 1] === b.d[i]) j++; const v = b.d[i]; if (v) { const yy = Math.min(y(0), y(v)); s += `<rect x="${x(i).toFixed(1)}" y="${yy.toFixed(1)}" width="${Math.max(0.8, x(Math.min(j + 1, n - 1)) - x(i)).toFixed(1)}" height="${Math.max(0.8, Math.abs(y(v) - y(0))).toFixed(1)}" style="fill:${col(v > 0 ? (b.pos || 'accent') : (b.neg || 'other'))}"/>`; } i = j + 1; } }
      else b.d.forEach((v, i) => { if (!v) return; const yy = Math.min(y(0), y(v)); s += `<rect x="${(L + i * bw + bw * 0.12).toFixed(1)}" y="${yy.toFixed(1)}" width="${Math.max(0.8, bw * 0.76).toFixed(1)}" height="${Math.max(0.8, Math.abs(y(v) - y(0))).toFixed(1)}" style="fill:${col(v > 0 ? (b.pos || 'accent') : (b.neg || 'other'))}"/>`; });
    }
    (p.series || []).forEach(se => {
      let d = '', pen = false;
      se.d.forEach((v, i) => { if (v == null || !isFinite(v)) { pen = false; return; } d += `${pen ? 'L' : 'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`; pen = true; });
      s += `<path d="${d}" style="fill:none;stroke:${col(se.c || 'muted')};stroke-width:${se.w || 1.5}${se.dash ? ';stroke-dasharray:5 4' : ''}${se.op ? ';opacity:' + se.op : ''}"/>`;
      if (se.label) { let k = se.d.length - 1; while (k > 0 && (se.d[k] == null || !isFinite(se.d[k]))) k--; labs.push({ y: y(se.d[k]) + 4, t: se.label, c: se.lc || (se.c === 'muted' ? 'muted' : 'text') }); }
    });
    (p.dots || []).forEach(dt => { s += `<circle cx="${x(dt.i).toFixed(1)}" cy="${y(dt.v).toFixed(1)}" r="${dt.r || 3.2}" style="fill:${col(dt.c || 'accent-strong')};stroke:var(--surface);stroke-width:1"/>`; });
    spreadLabels(labs, 14).forEach(l => { s += `<text x="${Wd - R + 6}" y="${l.y.toFixed(1)}" style="fill:${col(l.c)}">${l.t}</text>`; });
    y0 += h + (p.gap ?? 14);
  }
  (o.xl || []).forEach(([i, t, a]) => { s += `<text x="${x(i).toFixed(1)}" y="${y0 + 6}" text-anchor="${a || 'middle'}" class="num">${t}</text>`; });
  const H = y0 + (o.xl ? 12 : 0);
  return `<svg class="chart" viewBox="0 0 ${Wd} ${H.toFixed(0)}" role="img" aria-label="${o.aria || ''}">${s}</svg>`;
}

/* 数值横轴：散点、曲线、柱 */
function xy(o) {
  const Wd = o.w || 420, H = o.h || 260, L = o.l ?? 52, R = o.r ?? 18, T = o.ylab ? 26 : 12, B = o.xlab ? 46 : 28;
  const ax = [], ay = [];
  (o.pts || []).forEach(p => { ax.push(p[0]); ay.push(p[1]); });
  (o.curves || []).forEach(c => c.pts.forEach(p => { ax.push(p[0]); ay.push(p[1]); }));
  (o.rects || []).forEach(r => { ax.push(r[0], r[1]); ay.push(r[2], r[3]); });
  const xlo = o.xlo ?? Math.min(...ax), xhi = o.xhi ?? Math.max(...ax);
  let ylo = o.ylo ?? Math.min(...ay), yhi = o.yhi ?? Math.max(...ay);
  if (!(yhi > ylo)) { ylo -= 1; yhi += 1; }
  if (o.ylo == null) ylo -= (yhi - ylo) * 0.05; if (o.yhi == null) yhi += (yhi - ylo) * 0.06;
  const cx = v => Math.max(L, Math.min(Wd - R, L + (v - xlo) / (xhi - xlo) * (Wd - L - R)));
  const cy = v => Math.max(T, Math.min(H - B, T + (yhi - v) / (yhi - ylo) * (H - T - B)));
  let s = '';
  (o.polys || []).forEach(pg => { s += `<path d="${pg.pts.map((p, i) => `${i ? 'L' : 'M'}${cx(p[0]).toFixed(1)},${cy(p[1]).toFixed(1)}`).join('')}Z" style="fill:${col(pg.c || 'accent-soft')}"/>`; });
  const ty = ticks(ylo, yhi, o.ny || 4);
  ty.out.forEach(v => { s += `<line class="grid" x1="${L}" x2="${Wd - R}" y1="${cy(v).toFixed(1)}" y2="${cy(v).toFixed(1)}"/><text x="${L - 6}" y="${(cy(v) + 4).toFixed(1)}" text-anchor="end" class="num">${o.fy ? o.fy(v) : fmt(v, ty.d)}</text>`; });
  const xt = o.xt || ticks(xlo, xhi, o.nx || 5).out.map(v => [v, o.fx ? o.fx(v) : fmt(v, decOf(v))]);
  xt.forEach(([v, t]) => { s += `<text x="${cx(v).toFixed(1)}" y="${H - B + 16}" text-anchor="middle" class="num">${t}</text>`; });
  s += `<line class="axis" x1="${L}" x2="${Wd - R}" y1="${H - B}" y2="${H - B}"/>`;
  (o.rects || []).forEach(([x0, x1, y0, y1, c]) => { const a = cy(Math.max(y0, y1)), b = cy(Math.min(y0, y1)); s += `<rect x="${cx(x0).toFixed(1)}" y="${(b - a < 2 && y1 !== y0 ? b - 2 : a).toFixed(1)}" width="${Math.max(1, cx(x1) - cx(x0)).toFixed(1)}" height="${Math.max(y1 !== y0 ? 2 : 0, b - a).toFixed(1)}" style="fill:${col(c || 'accent')}"/>`; });
  (o.hl || []).forEach(h => { s += `<line x1="${L}" x2="${Wd - R}" y1="${cy(h.v).toFixed(1)}" y2="${cy(h.v).toFixed(1)}" style="stroke:${col(h.c || 'muted')};stroke-width:1${h.dash ? ';stroke-dasharray:5 4' : ''}"/>`; if (h.label) s += `<text x="${Wd - R - 4}" y="${(cy(h.v) - 5).toFixed(1)}" text-anchor="end" style="fill:${col(h.c || 'muted')}">${h.label}</text>`; });
  (o.vl || []).forEach(v => { s += `<line x1="${cx(v.v).toFixed(1)}" x2="${cx(v.v).toFixed(1)}" y1="${T}" y2="${H - B}" style="stroke:${col(v.c || 'muted')};stroke-width:${v.w || 1}${v.dash ? ';stroke-dasharray:5 4' : ''}"/>`; if (v.label) s += `<text x="${(cx(v.v) + (v.a === 'end' ? -5 : 5)).toFixed(1)}" y="${T + 12 + (v.dy || 0)}" text-anchor="${v.a || 'start'}" style="fill:${col(v.c || 'muted')}">${v.label}</text>`; });
  (o.pts || []).forEach(p => { s += `<circle cx="${cx(p[0]).toFixed(1)}" cy="${cy(p[1]).toFixed(1)}" r="2.2" style="fill:${col(o.pc || 'muted')};opacity:0.5"/>`; });
  (o.curves || []).forEach(c => {
    s += `<path d="${c.pts.map((p, i) => `${i ? 'L' : 'M'}${cx(p[0]).toFixed(1)},${cy(p[1]).toFixed(1)}`).join('')}" style="fill:none;stroke:${col(c.c || 'accent')};stroke-width:${c.w || 2}${c.dash ? ';stroke-dasharray:5 4' : ''}"/>`;
    if (c.label) { const [lx, ly, la] = c.lp || [c.pts[c.pts.length - 1][0], c.pts[c.pts.length - 1][1], 'end']; s += `<text class="halo" x="${(cx(lx) + (la === 'start' ? 6 : la === 'end' ? -6 : 0)).toFixed(1)}" y="${(cy(ly) - 7).toFixed(1)}" text-anchor="${la}" style="fill:${col(c.lc || 'text')}">${c.label}</text>`; }
  });
  (o.marks || []).forEach(m => { s += `<circle cx="${cx(m.x).toFixed(1)}" cy="${cy(m.y).toFixed(1)}" r="${m.r || 4.5}" style="fill:${col(m.c || 'accent-strong')};stroke:var(--surface);stroke-width:1.5"/>`; if (m.label) s += `<text class="halo" x="${(cx(m.x) + (m.a === 'end' ? -8 : 8)).toFixed(1)}" y="${(cy(m.y) + (m.dy ?? -8)).toFixed(1)}" text-anchor="${m.a || 'start'}" style="fill:${col(m.lc || 'text')}">${m.label}</text>`; });
  if (o.xlab) s += `<text x="${((L + Wd - R) / 2).toFixed(1)}" y="${H - 8}" text-anchor="middle">${o.xlab}</text>`;
  if (o.ylab) s += `<text x="${L - 6}" y="14" text-anchor="start">${o.ylab}</text>`;
  return `<svg class="chart" viewBox="0 0 ${Wd} ${H}" role="img" aria-label="${o.aria || ''}">${s}</svg>`;
}

/* 横向条形（有正负） */
function hbars(items, o = {}) {
  const Wd = o.w || CW(), L = o.l ?? 120, R = o.r ?? 70, rh = o.rh || 28, H = items.length * rh + 6;
  const m = Math.max(...items.map(d => Math.abs(d.v))) || 1, mid = L + (Wd - L - R) / 2, half = (Wd - L - R) / 2 - 44;
  let s = `<line class="axis" x1="${mid}" x2="${mid}" y1="2" y2="${H - 2}"/>`;
  items.forEach((d, i) => {
    const y = 3 + i * rh, w = Math.abs(d.v) / m * half, x0 = d.v >= 0 ? mid : mid - w;
    s += `<text x="8" y="${y + rh / 2 + 4}" class="t-strong">${d.label}</text><rect x="${x0.toFixed(1)}" y="${y + 6}" width="${Math.max(1, w).toFixed(1)}" height="${rh - 12}" rx="2" style="fill:${col(d.c || 'accent')}"/>`;
    s += `<text x="${(d.v >= 0 ? mid + w + 6 : mid - w - 6).toFixed(1)}" y="${y + rh / 2 + 4}" text-anchor="${d.v >= 0 ? 'start' : 'end'}" class="num">${o.f ? o.f(d.v) : fmt(d.v, 1)}</text>`;
    if (d.tag) s += `<text x="${Wd - 8}" y="${y + rh / 2 + 4}" text-anchor="end" style="fill:${col(d.tc || 'muted')}">${d.tag}</text>`;
  });
  return `<svg class="chart" viewBox="0 0 ${Wd} ${H}" role="img" aria-label="${o.aria || ''}">${s}</svg>`;
}

function histRects(vals, lo, hi, nb, cfn) {
  const w = (hi - lo) / nb, cnt = Array(nb).fill(0);
  vals.forEach(v => { const k = Math.max(0, Math.min(nb - 1, Math.floor((v - lo) / w))); cnt[k]++; });
  return cnt.map((c, k) => [lo + k * w + w * 0.08, lo + (k + 1) * w - w * 0.08, 0, c, cfn ? cfn(lo + (k + 0.5) * w) : 'accent']);
}

/* 控件 */
function ctl(el, defs, v) {
  return `<div class="ctrl">${defs.map(([k, lab, mn, mx, st]) => `<label for="${el.id}-${k}">${lab}</label><input type="range" id="${el.id}-${k}" min="${mn}" max="${mx}" step="${st}" value="${v[k]}"><output id="${el.id}-${k}-o" for="${el.id}-${k}"></output>`).join('')}</div>`;
}
function bindCtl(el, defs, v, upd) {
  const show = () => defs.forEach(([k, , , , , f]) => { el.querySelector(`#${el.id}-${k}-o`).textContent = f ? f(v[k]) : v[k]; });
  defs.forEach(([k]) => el.querySelector(`#${el.id}-${k}`).addEventListener('input', ev => { v[k] = +ev.target.value; show(); upd(); }));
  show();
}
function segs(el, k, lab, opts, v) {
  return `<div class="pref"><span id="${el.id}-${k}-l">${lab}</span><div class="seg" role="group" aria-labelledby="${el.id}-${k}-l">${opts.map(([val, t]) => `<button type="button" data-k="${k}" data-v="${val}" aria-pressed="${String(v[k] === val)}">${t}</button>`).join('')}</div></div>`;
}
function bindSeg(el, v, upd) {
  el.querySelectorAll('button[data-k]').forEach(b => b.addEventListener('click', () => {
    const k = b.dataset.k, raw = b.dataset.v; v[k] = raw !== '' && !isNaN(+raw) ? +raw : raw;
    el.querySelectorAll(`button[data-k="${k}"]`).forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    upd();
  }));
}

/* 截面排序 */
W.xsec = el => {
  const v = { fac: 'mix', ic: 0.05, seed: 3 };

  const z = a => { const m = mean(a), s = sd(a); return a.map(x => (x - m) / s); };
  const defs = [['ic', '因子强度 IC', 0, 0.15, 0.01, x => x.toFixed(2)]];
  el.innerHTML = `<div class="bar">${segs(el, 'fac', '排序指标', [['mom', '60 日动量'], ['carry', '年化展期收益'], ['mix', '两者合成']], v)}</div>
    <div class="cv"></div>

    <div class="grid2"><div class="cv2"></div><div class="cv3"></div></div><p class="msg"></p>`;
  function upd() {
    const zm = z(mom), zc = z(carry);
    const val = v.fac === 'mom' ? mom : v.fac === 'carry' ? carry : zm.map((x, i) => (x + zc[i]) / 2);
    const items = names.map((nm, i) => ({ label: nm, v: val[i] })).sort((a, b) => b.v - a.v);

  }
  bindCtl(el, defs, v, upd); bindSeg(el, v, upd);

};

/* 配对交易 */
W.pairs = el => {
  const v = { hl: 10, ent: 2, brk: 0, seed: 5 };

    ${ctl(el, defs, v)}<div class="cv"></div><p class="msg"></p>
    <p class="note">B 是随机游走，A = B + 常数 + 价差，价差按设定的半衰期回归。z 值用过去 60 天的均值和标准差计算。z 超过 ±4 时止损，之后等 z 回到 ±1 以内才允许重新开仓。</p>`;
  function upd() {
    const g = gaussOf(rngOf(v.seed * 31337)), n = 500, th = Math.LN2 / v.hl, B = [100], S = [0];
    for (let i = 1; i < n; i++) { B.push(B[i - 1] + g()); S.push(S[i - 1] * (1 - th) + g() * 0.5 + (v.brk && i > 300 ? 0.08 : 0)); }
    const A = B.map((b, i) => b + 5 + S[i]), sp = A.map((a, i) => a - B[i]), W0 = 60, zz = Array(n).fill(null);
    for (let i = W0; i < n; i++) { const w = sp.slice(i - W0, i); zz[i] = (sp[i] - mean(w)) / (sd(w) || 1); }
    const pos = Array(n).fill(0); let cur = 0, cool = false, nt = 0, stops = 0, wins = 0, entS = 0;
    for (let i = W0; i < n; i++) {
      const zv = zz[i];
      if (cur === 0) { if (cool && Math.abs(zv) < 1) cool = false; if (!cool) { if (zv > v.ent) { cur = -1; entS = sp[i]; nt++; } else if (zv < -v.ent) { cur = 1; entS = sp[i]; nt++; } } }
      else if (Math.abs(zv) > 4) { cur = 0; stops++; cool = true; }
      else if ((cur < 0 && zv <= 0) || (cur > 0 && zv >= 0)) { if ((sp[i] - entS) * cur > 0) wins++; cur = 0; }
      pos[i] = cur;
    }
    const eq = [0]; for (let i = 1; i < n; i++) eq.push(eq[i - 1] + pos[i - 1] * (sp[i] - sp[i - 1]) - 0.05 * Math.abs(pos[i] - pos[i - 1]));
    const x0 = sp.slice(0, -1), y0 = sp.slice(1).map((s, i) => s - sp[i]), mx = mean(x0), my = mean(y0);
    let cxy = 0, cxx = 0; x0.forEach((xi, i) => { cxy += (xi - mx) * (y0[i] - my); cxx += (xi - mx) ** 2; });
    const b = cxy / cxx, hlEst = b < 0 && b > -1 ? -Math.LN2 / Math.log(1 + b) : Infinity;

/* 伽马：对冲收益与时间价值 */
W.gamma = el => {
  const v = { rv: 40, iv: 30, band: 1, seed: 31 };
  const defs = [['rv', '实现波动率（年化 %）', 10, 80, 1], ['iv', '隐含波动率（年化 %）', 10, 80, 1], ['band', '对冲带宽（%）', 0.2, 3, 0.1, x => x.toFixed(1)]];
  el.innerHTML = `${ctl(el, defs, v)}<div class="bar"><button type="button" class="btn quiet" data-act="seed">换一条路径</button><span class="status">20 天，每 15 分钟一个价格</span></div>
    <div class="cv"></div><p class="msg"></p>
    <p class="note">每次价格相对上次对冲点移动超过带宽就对冲一次，收益为该段收益率的平方 ÷ 隐含日方差，单位是“一天的时间价值”。时间价值每天损耗 1 个单位。没有计入手续费，也忽略了 gamma 随价格的变化。</p>`;
  function upd() {
    const g = gaussOf(rngOf(v.seed * 577)), steps = 96, days = 20, n = steps * days + 1, sdS = v.rv / 100 / Math.sqrt(252 * steps), ivd2 = (v.iv / 100) ** 2 / 252;
    let S = 100, Sh = 100, gain = 0, hedges = 0; const gs = [0], th = [0], net = [0];
    for (let i = 1; i < n; i++) { S *= Math.exp(sdS * g()); const r = S / Sh - 1; if (Math.abs(r) > v.band / 100) { gain += r * r / ivd2; Sh = S; hedges++; } gs.push(gain); th.push(-i / steps); net.push(gain - i / steps); }
    el.querySelector('.cv').innerHTML = plot({ n, aria: '对冲收益、时间价值与净值', panels: [{ h: 220, title: '累计（单位：一天的时间价值）', series: [{ d: th, c: 'other', dash: 1, w: 1.6, label: '时间价值损耗' }, { d: gs, c: 'accent', w: 1.6, label: '对冲收益' }, { d: net, c: 'accent-strong', w: 2.4, label: '净值' }], hl: [{ v: 0 }] }], xl: [[0, '第 1 天', 'start'], [n - 1, `第 ${days} 天`, 'end']] });
    const exp = days * ((v.rv / v.iv) ** 2 - 1);
    el.querySelector('.msg').textContent = `对冲 ${hedges} 次，对冲收益 ${fmt(gain, 1)}，时间价值损耗 ${days}，净值 ${sgn(gain - days, 1)}。按公式的期望约为 天数 ×（实现² ÷ 隐含² − 1）= ${sgn(exp, 1)}。实现波动率高于隐含波动率时净值向上，反之向下；带宽改变的主要是净值的波动和对冲次数。`;
  }
  bindCtl(el, defs, v, upd);
  el.querySelector('[data-act="seed"]').addEventListener('click', () => { v.seed++; upd(); });
  upd();
};

      return `<button type="button" data-i="${k}" class="${cls}" aria-label="第 ${k + 1} 条" ${st.pick != null ? 'disabled' : ''}><svg viewBox="0 0 200 90" class="chart"><line x1="4" x2="196" y1="${y(0).toFixed(1)}" y2="${y(0).toFixed(1)}" style="stroke:var(--border)"/><path d="${c.map((v, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join('')}" style="fill:none;stroke:${st.pick != null && k === st.real ? 'var(--accent-strong)' : 'var(--text)'};stroke-width:1.3"/></svg><span class="cap">${k + 1}${cap ? ' · ' + cap : ''}</span></button>`;
    }).join('');
    el.querySelectorAll('.lineup button').forEach(b => b.addEventListener('click', () => { if (st.pick != null) return; st.pick = +b.dataset.i; st.total++; if (st.pick === st.real) st.right++; draw(); }));
    el.querySelector('.sc').textContent = st.total ? `本次打开页面以来：认对 ${st.right} / ${st.total}` : '';
    el.querySelector('.msg').textContent = st.pick == null ? '还没有选择。' : `${st.pick === st.real ? '选对了。' : `有真实优势的是第 ${st.real + 1} 条。`}只看一年的净值，夏普 1.5 的策略和随机曲线经常无法区分；随机猜中的概率是 1/9。多做几组，看认对的比例是否明显高于 11%。`;
  }
  el.querySelector('[data-act="next"]').addEventListener('click', () => { st.seed++; st.pick = null; draw(); });
  draw();
};

buildIndex();
route(false);
window.addEventListener('hashchange', () => route(true));
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
